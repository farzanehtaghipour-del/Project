<!--
  ترتیب بارگذاری مهم است:
    1) config.js      → راه‌کارها، آیکون‌ها، گزینه‌های مشترک و ثابت‌ها
    2) questions.js   → بانک پرسش‌ها و داده‌های پرسش‌نامه‌ها
    3) scoring.js     → موتورهای نمره‌دهی و منطق محاسباتی
    4) edu.js         → سیستم آموزشی مشترک (بلوک‌ها و گام‌ها)
    5) mcal-data.js   → کتابخانهٔ محتوای «تقویم سلامت مردان»
    6) mcal.js        → موتور گزارش/توصیه و نماهای تقویم سلامت مردان
    7) fslib.js       → گزارش هوشمند سلامت جنسی زنان (FSFI + FSDS-R)
    8) app.js         → وضعیت، مسیریابی، رندر، نماها و رویدادها — v45: کلیک روی روز تقویم دیگر دفترچهٔ علائم را خودکار باز نمی‌کند (درخواست کارفرما)، جملهٔ «دفترچهٔ علائم من» به راهنمای زیر ثبت شروع اضافه شد
    9) symptom-journal.js → ماژول مستقل «دفترچهٔ علائم من» — v18: هشدار جدی‌تر خون‌ریزی زیاد و کارت پیگیری با نشانه‌های داده‌ای چرخه (پریود >۷ روز، چرخهٔ بیرون ۲۱..۳۵، نبود پریود >۹۰ روز)، اصلاح نقطهٔ طب فشاری SP6، نرم‌شدن ادعاهای ورزش، گام‌های باز در کارت‌های هشدار
    10) symjournal-adapter.js → آداپتور اتصال دفترچه به cyDb/cxModel (پس از app.js)
    11) sj-books.js → دفترچه‌های تغذیه و دمنوش‌ها (پس از دفترچهٔ علائم؛ از RECS آن می‌خواند) — v6: جلدهای جدید با عکس کارفرما (Healthy Soup Skin / Herbal Tea Skin) و تم سبز
    12) pp-content.js → محتوای «همراه مادر»: فازها، کارت‌های روز، ۱۸ راهنما، چک‌این، قواعد توصیه، علائم هشدار، PHQ-2، برچسب‌های کوتاه کمک همسر + دلگرمی‌ها — v4: پالت شاد صورتی/آبی/نارنجی/یاسیِ پررنگ
    13) pp-companion.js → منطق و رندر «همراه مادر» — v4 (نسخهٔ ۲.۴): محتوای حمایتی «من هم مهمم» به تب «مراقبت من» منتقل شد و در تب «امروز» فقط پل کوتاه «مراقبت از خودم» مانده؛ شش عکس کوچک هم‌راستا در ورودی + مینی‌نمودار (بهبود من/رشد نوزاد) و دلگرمی زیر عکس‌ها، آرتیفکت قاب‌دار تقویم، پس‌زمینهٔ ابریشمی کل بخش، چهار بخش تب‌شده، کارت هشدار نرم با تماس ۱۱۵، پشتیبان‌گیری/بازیابی، حالت شب با چیپ‌های خوانا
    14) pp-adapter.js → آداپتور اتصال «همراه مادر» به JAL/تقویم سَمن + مهاجرت از نسخهٔ قدیم (پس از app.js)
    15) pp-support-content.js → کتابخانهٔ محتوای «من هم مهمم» (حمایت عاطفی مادر) — نسخهٔ ۲٫۳: ۴ کارت، ۳۵ زیرموضوع (موضوع‌های تازهٔ ۲٫۲: بستری‌بودن نوزاد، از دست دادن نوزاد — هر دو manualOnly، فقط با انتخاب صریح موضوع)، ۱۴ پرامپت دفترچه، ۱۴ آیتم روزانه، سه سطح ایمنی، جدول و اعداد معتبر + ACKS، TIME_LINES، CALM و CRISIS_LINES (شماره‌های حمایتی رایگان، قابل‌تغییر برای کشورهای دیگر) + نگاشت تصاویر فلش‌کارت‌ها (PP_SUPPORT_CARD_IMG — فعلاً placeholder از img/pp)
    16) pp-support.js → منطق و رندر «من هم مهمم» — v2.5.0: بخش به تب «مراقبت من» منتقل شد و صفحهٔ اصلی آن با چهار ورودی بصری بازطراحی شد (وقتی دلم می‌گیره ← وقتی به خودم شک می‌کنم ← بدنم هم به زمان نیاز داره ← حرف دلم رو بنویسم، هر کدام با شمارندهٔ موضوع‌ها)؛ جریان فلش‌کارت طبق ۲٫۴: فهرست موضوع‌های سه بخش متن ساده (بدون عکس) و با لمس هر موضوع، فلش‌کارت «کارت برگردان» همان موضوع تکی باز می‌شود (روی کارت: عکس + چیپ + عنوان؛ پشت: «شاید…» + نگاه تازه + یک قدم کوچک + دکمهٔ متن کامل؛ چرخش سه‌بعدی با لمس/Enter)، ورود سریع «الان چه حالی داری؟» با جملهٔ به رسمیت‌شناختن، شخصی‌سازی از دادهٔ مادر، «یادش می‌ماند»، سه سطح ایمنی، بررسی ایمنی دو سطحی دفترچه (riskTier)، لینک «اگر کمک فوری لازم داری»، manualOnly، خواندن صوتی، شیت «چرا این‌جا؟» + تمرین تنفس، قلب «به دلم نشست»، جملهٔ زمان‌آگاه، پل نرم به PHQ-2، جملهٔ پایانی؛ + شنونده‌های روی ریشهٔ #ppHost و مسیر مستقیم دفترچه
  همه‌ی فایل‌ها در یک scope سراسری مشترک اجرا می‌شوند (مانند نسخه‌ی یک‌پارچه‌ی اصلی).
-->
